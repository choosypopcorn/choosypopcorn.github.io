name: Deploy Sculpin Site to Pages
on:
  push:
    branches:
      - main  # Trigger build on pushes to the main branch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv

      - name: Validate Composer Files
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Compile Static Site with Sculpin
        run: vendor/bin/sculpin generate --env=prod

      - name: Setup GitHub Pages Artifact Settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Static Files Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Sculpin compiles production environments into output_prod/
          path: ./output_prod

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4